<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Laporan Data Kelas</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
    body {
        font-family: Arial, sans-serif;
        background: #f4f6f8;
        padding: 20px;
    }
    h2 {
        text-align: center;
    }
    .sumber {
        text-align: center;
        font-size: 13px;
        margin-bottom: 10px;
    }
    table {
        width: 100%;
        border-collapse: collapse;
        background: white;
    }
    th, td {
        border: 1px solid #ccc;
        padding: 8px;
        text-align: center;
        font-size: 14px;
    }
    th {
        background: #1976d2;
        color: white;
    }
    tr:nth-child(even) {
        background: #f2f2f2;
    }
    .filter {
        text-align: center;
        margin-bottom: 10px;
    }
    select {
        padding: 6px;
    }
</style>
</head>
<body>

<h2>LAPORAN DATA KELAS</h2>

<div class="sumber">
    Sumber Data:
    <a href="https://docs.google.com/spreadsheets/d/e/2PACX-1vR8ZXd-OkTl0X6MvGcTrr7yxbYOA6F8nCYq7B5cX3eCilGRoqKzSNJp5ifEcIt7u2veOYp1IUPEdR3h/pub?gid=78947370&single=true&output=csv" target="_blank">
        Google Spreadsheet
    </a>
</div>

<div class="filter">
    Filter Kelas :
    <select id="filterKelas" onchange="filterData()">
        <option value="">Semua Kelas</option>
    </select>
</div>

<table>
    <thead>
        <tr>
            <th>KELAS</th>
            <th>JAM KE</th>
            <th>HARI</th>
            <th>MATA PELAJARAN</th>
            <th>KEADAAN KELAS</th>
        </tr>
    </thead>
    <tbody id="dataTable"></tbody>
</table>

<script>
// GOOGLE APPS SCRIPT (DEPLOYMENT)
const apiURL = "https://script.google.com/macros/s/AKfycbyGjzsGwNyoDeFFfYMlXHpULwGYj5qCiixyw9W9GLA3EYeH4Qmeiq3IsxA_QUGW_DK3vw/exec";

// LINK CSV (REFERENSI DATA)
const sheetCSV = "https://docs.google.com/spreadsheets/d/e/2PACX-1vR8ZXd-OkTl0X6MvGcTrr7yxbYOA6F8nCYq7B5cX3eCilGRoqKzSNJp5ifEcIt7u2veOYp1IUPEdR3h/pub?gid=78947370&single=true&output=csv";

let allData = [];

// Ambil data dari Apps Script
fetch(apiURL)
.then(res => res.json())
.then(data => {
    allData = data;
    tampilkanData(allData);
    isiFilterKelas();
})
.catch(err => {
    alert("Gagal mengambil data dari server!");
    console.error(err);
});

function tampilkanData(data) {
    const table = document.getElementById("dataTable");
    table.innerHTML = "";
    data.forEach(row => {
        table.innerHTML += `
        <tr>
            <td>${row["KELAS"]}</td>
            <td>${row["JAM KE"]}</td>
            <td>${row["HARI"]}</td>
            <td>${row["MATA PELAJARAN"]}</td>
            <td>${row["KEADAAN KELAS"]}</td>
        </tr>`;
    });
}

function isiFilterKelas() {
    const kelasUnik = [...new Set(allData.map(d => d["KELAS"]))];
    const select = document.getElementById("filterKelas");
    kelasUnik.forEach(k => {
        select.innerHTML += `<option value="${k}">${k}</option>`;
    });
}

function filterData() {
    const kelas = document.getElementById("filterKelas").value;
    if (kelas === "") {
        tampilkanData(allData);
    } else {
        tampilkanData(allData.filter(d => d["KELAS"] === kelas));
    }
}
</script>

</body>
</html>

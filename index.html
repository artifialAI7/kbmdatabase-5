<!DOCTYPE html>
<html lang="id">
<head>
	<meta charset="UTF-8">
	<title>Laporan Data Kelas</title>
	<style>
		body { font-family: Arial; background:#f4f6f8; }
		h2 { text-align: center; margin-top: 18px; }
		.controls{display:flex;gap:8px;justify-content:space-between;align-items:center;margin:12px 0}
		.center-controls{display:flex;gap:8px;align-items:center}
		.right-controls{display:flex;align-items:center}
		.icon-btn{width:40px;height:40px;border-radius:50%;border:none;background:#1976d2;color:#fff;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 2px 6px rgba(0,0,0,.12)}
		.icon-btn:hover{background:#155fa6}
		.logout-btn{padding:8px 12px;border-radius:6px;border:1px solid #ccc;background:#fff;color:#333;cursor:pointer}
		.logout-btn:hover{background:#f4f4f4}
		.icon-btn[aria-busy="true"]{background:#165092}
		.icon-btn[aria-busy="true"] svg{animation:rotate 1s linear infinite}
		@keyframes rotate{to{transform:rotate(360deg)}}
		table { border-collapse: collapse; width: 100%; background:#fff; }
		th, td { border:1px solid #ccc; padding:8px; text-align:center; }
		th { background:#1976d2; color:white; }
	</style>
		<script>
			// Simple client-side auth check: redirect to login if not authenticated
			try{
				if (localStorage.getItem('authenticated') !== '1') {
					location.href = 'login.html';
				}
			}catch(e){ /* ignore when storage not available */ }
		</script>
</head>
<body>

<h2>Laporan KBM Kelas semester Genap 2025</h2>
<div class="controls">
	<div class="center-controls">
		<button id="refreshBtn" class="icon-btn" title="Refresh data" aria-label="Refresh">
			<!-- refresh icon -->
			<svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
				<path d="M21 12a9 9 0 10-8.94 9" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path>
				<path d="M21 3v6h-6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path>
			</svg>
		</button>
		<span id="lastUpdated" style="color:#555;align-self:center"></span>
	</div>
	<div class="right-controls">
		<button id="logoutBtn" class="logout-btn" title="Logout">Logout</button>
	</div>
</div>
<table id="tabel">
	<thead>
		<tr>
			<th>Kelas</th>
			<th>Jam Ke</th>
			<th>Hari</th>
			<th>Mata Pelajaran</th>
			<th>Keadaan Kelas</th>
		</tr>
	</thead>
	<tbody></tbody>
</table>


<script>
const apiURL = "https://script.google.com/macros/s/AKfycbyGjzsGwNyoDeFFfYMlXHpULwGYj5qCiixyw9W9GLA3EYeH4Qmeiq3IsxA_QUGW_DK3vw/exec";

const tbody = document.querySelector('#tabel tbody');
const refreshBtn = document.getElementById('refreshBtn');
const logoutBtn = document.getElementById('logoutBtn');
const lastUpdated = document.getElementById('lastUpdated');

async function fetchData(){
	refreshBtn.disabled = true;
	refreshBtn.setAttribute('aria-busy','true');
	try{
		const res = await fetch(apiURL);
		const data = await res.json();
		tbody.innerHTML = '';
		data.forEach(row => {
			const tr = document.createElement('tr');
			tr.innerHTML = `
				<td>${row.KELAS ?? ''}</td>
				<td>${row['JAM KE'] ?? ''}</td>
				<td>${row.HARI ?? ''}</td>
				<td>${row['MATA PELAJARAN'] ?? ''}</td>
				<td>${row['KEADAAN KELAS'] ?? ''}</td>`;
			tbody.appendChild(tr);
		});
		lastUpdated.textContent = 'Terakhir: ' + new Date().toLocaleString();
	}catch(err){
		console.error('Fetch error:', err);
		alert('Gagal memuat data. Periksa koneksi atau API.');
	}finally{
		refreshBtn.disabled = false;
		refreshBtn.removeAttribute('aria-busy');
	}
}

refreshBtn.addEventListener('click', fetchData);
logoutBtn.addEventListener('click', ()=>{
	try{ localStorage.removeItem('authenticated'); }catch(e){}
	location.href = 'login.html';
});

// initial load
fetchData();
</script>


</body>
</html>
